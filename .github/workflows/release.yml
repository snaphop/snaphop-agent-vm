# The only publishing path. Pushing a vX.Y.Z tag builds the static Linux
# binaries and attaches them, with LICENSE and NOTICE, to a GitHub Release.
# A merge does not run this workflow. The tag pattern is a glob: v0.1.0 and
# v0.1.0-rc.1 both match, and a hyphen in the tag marks the release as a
# pre-release.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Nothing gets write access by default. Building runs the repository's own
# scripts and third-party actions, so it gets a read-only token; only the
# publish job, which runs no repository code, may create the release.
permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same toolchain as the verify workflow. golangci-lint v2.14 needs Go
      # 1.26 or newer; go.mod still declares the 1.22 language version.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true
          verify: false
          skip-cache: true

      - name: Run scripts/check.sh
        run: scripts/check.sh

      - name: Build the release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: scripts/build-release.sh

      - name: Check the binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            bin="dist/agent-vm-linux-$arch"
            test -x "$bin"
            # CGO is disabled, so a dynamically linked binary is a broken build.
            if ! file "$bin" | grep -q 'statically linked'; then
              echo "$bin is not a static binary:" >&2
              file "$bin" >&2
              exit 1
            fi
            # -s -w strips symbols, not string data. These phrases are how the
            # linked licenses require a binary to carry their notices. A build
            # that dropped the embed would still be a static binary.
            for needle in \
              'Copyright (c) 2026 SnapHop' \
              'Copyright (c) 2013 TOML authors' \
              'Copyright 2009 The Go Authors.'
            do
              if ! grep -a -F -q "$needle" "$bin"; then
                echo "$bin is missing the license notice: $needle" >&2
                exit 1
              fi
            done
          done
          version_output="$(./dist/agent-vm-linux-amd64 --version)"
          printf '%s\n' "$version_output"
          if ! printf '%s\n' "$version_output" | grep -F "$VERSION"; then
            echo "the amd64 binary does not report $VERSION" >&2
            exit 1
          fi
          cmp -s LICENSE dist/LICENSE || { echo "dist/LICENSE differs from LICENSE" >&2; exit 1; }
          cmp -s NOTICE dist/NOTICE || { echo "dist/NOTICE differs from NOTICE" >&2; exit 1; }

      - name: Write checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum agent-vm-linux-amd64 agent-vm-linux-arm64 LICENSE NOTICE > SHA256SUMS
          cat SHA256SUMS

      - name: Upload the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: |
            dist/agent-vm-linux-amd64
            dist/agent-vm-linux-arm64
            dist/LICENSE
            dist/NOTICE
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout: this job runs only gh against files the build job
      # produced, so the write token never meets repository code.
      - name: Download the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist

      - name: Verify the checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            "${args[@]}" \
            dist/agent-vm-linux-amd64 \
            dist/agent-vm-linux-arm64 \
            dist/LICENSE \
            dist/NOTICE \
            dist/SHA256SUMS
