#cloud-config
# Generated by agent-vm 0.1.0-test. Do not edit: this file is
# regenerated from the VM's configuration and is kept only as a record of what
# the guest was configured with.
#
# This is the whole guest-side contract. It authorizes public keys, creates the
# login user and the group that lets it reach the Docker socket, and does
# nothing else — no packages, no commands, no credentials.
# A base image is shared by every VM built on it, so anything per-VM has to
# arrive here, and anything secret must not arrive at all (SECURITY.md).

# Only agent-vm's own settings may name the host; a stale hostname from the
# image would make two VMs indistinguishable in logs.
hostname: "agent-01"
preserve_hostname: false

# Docker's socket is owned by root:docker, so the login user has to be in that
# group to run `docker` without sudo. The group is declared here rather than
# only in the base image's boot-time unit because a group added to an account
# after it has already logged in does not apply to that session, and the first
# SSH session can land before a post-cloud-init unit has run.
#
# Declaring the group is what keeps this safe on a base image that has no
# Docker — one built before the guest tooling landed. cloud-init creates groups
# before users, so the account is created either way; without this, a missing
# group would fail user creation and leave the VM unreachable (AGENTS.md §8).
groups:
  - docker

users:
  - name: "agent"
    groups:
      - docker
    # No password is ever set, so the account is reachable by key only. sudo is
    # granted through a sudoers drop-in rather than by adding the user to a
    # group, because the group that confers sudo differs per distro and this
    # file must mean the same thing on all of them.
    lock_passwd: true
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: /bin/bash
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ1TfEt0YKXQ+eZmJHCcTKQ0lMSzQFm/kQGHMvhE7Hqx agent@example"

# Passwords are never accepted: the only way in is a key listed above.
ssh_pwauth: false
disable_root: true
