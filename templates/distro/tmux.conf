# --- General settings ---
set -g mouse on                         # Enable mouse for pane switching, scrolling
set -g history-limit 100000             # Increase scrollback history
set-option -g status off                # Turn off status bar

# --- Vi mode ---
setw -g mode-keys vi                    # Use vi-style key bindings in copy mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# --- Easier splits ---
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# --- Better colors ---
set -g default-terminal "screen-256color"
set -as terminal-overrides ',xterm-256color:Tc'

# --- Status bar ---
set -g status-bg black
set -g status-fg white
set -g status-interval 10
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=green]#H"
set -g status-right "#[fg=yellow]%Y-%m-%d %H:%M #[fg=cyan]#(whoami)"

# --- Clipboard support (for systems using xclip or pbcopy) ---
# Linux (requires xclip or xsel)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i -f"

# For vi mode keys
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -i -selection clipboard"

# For emacs mode keys (if you don't use vi mode)
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -i -selection clipboard"

# macOS (uncomment if needed)
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# For vi mode keys
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# For emacs mode keys (if you don't use vi mode)
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# --- Start windows and panes in current directory ---
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# --- Auto rename window off (useful if SSHing into multiple hosts) ---
set-option -g allow-rename off
